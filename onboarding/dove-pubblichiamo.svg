<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <!-- Illustrazione semplificata della pagina per creare le storie in Meta Business Suite: non è uno screenshot.
       Per usare uno screenshot vero basta salvarlo come onboarding/dove-pubblichiamo.png (lo carica il pannello). -->
  <rect width="960" height="540" fill="#eef0f5"/>

  <!-- finestra del browser -->
  <rect x="20" y="18" width="920" height="504" rx="12" fill="#fff" stroke="#d9dce6"/>
  <path d="M32 18 H928 A12 12 0 0 1 940 30 V62 H20 V30 A12 12 0 0 1 32 18 Z" fill="#f4f5f9"/>
  <circle cx="44" cy="40" r="6" fill="#f17c7c"/><circle cx="64" cy="40" r="6" fill="#f3c560"/><circle cx="84" cy="40" r="6" fill="#6ccf8a"/>
  <rect x="110" y="28" width="420" height="24" rx="12" fill="#fff" stroke="#dfe2ea"/>
  <text x="126" y="45" font-size="13" fill="#5c6075">business.facebook.com/latest/story_composer</text>

  <!-- barra laterale -->
  <rect x="20" y="62" width="64" height="460" fill="#f8f9fb"/>
  <g fill="#dfe2ea">
    <rect x="38" y="86" width="28" height="28" rx="7"/><rect x="38" y="132" width="28" height="28" rx="7"/>
    <rect x="38" y="178" width="28" height="28" rx="7"/><rect x="38" y="224" width="28" height="28" rx="7"/>
  </g>

  <!-- titolo della pagina -->
  <rect x="112" y="86" width="190" height="16" rx="4" fill="#c9ccd8"/>

  <!-- riquadro con la pagina e il profilo su cui verrà pubblicata la storia -->
  <rect x="104" y="120" width="460" height="138" rx="12" fill="#f6f4ff" stroke="#6045e8" stroke-width="4"/>
  <rect x="124" y="138" width="150" height="11" rx="4" fill="#b7b0e6"/>
  <circle cx="146" cy="184" r="17" fill="#5b7bd5"/>
  <text x="146" y="190" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">P</text>
  <text x="176" y="191" font-size="20" font-weight="700" fill="#26293d">Nome della tua Pagina</text>
  <circle cx="146" cy="228" r="17" fill="#c95b9a"/>
  <text x="146" y="233" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">IG</text>
  <text x="176" y="235" font-size="20" font-weight="700" fill="#26293d">nome_profilo</text>

  <!-- fumetto con la spiegazione -->
  <path d="M250 258 L 264 282 L 236 282 Z" fill="#6045e8"/>
  <rect x="120" y="282" width="420" height="78" rx="12" fill="#6045e8"/>
  <text x="140" y="314" font-size="18" font-weight="800" fill="#fff">Copia questo nome, esattamente com’è</text>
  <text x="140" y="342" font-size="13" fill="#e7e2ff">Maiuscole, spazi e punti compresi.</text>

  <!-- resto del modulo -->
  <rect x="112" y="384" width="120" height="12" rx="4" fill="#e6e8ef"/>
  <rect x="104" y="406" width="460" height="92" rx="10" fill="#f8f9fb" stroke="#e1e4ec"/>
  <rect x="134" y="435" width="130" height="34" rx="8" fill="#dfe2ea"/>

  <!-- anteprima della storia -->
  <rect x="660" y="86" width="190" height="338" rx="18" fill="#2a2d3f"/>
  <rect x="674" y="100" width="162" height="310" rx="10" fill="#3b3f57"/>
  <rect x="692" y="300" width="126" height="16" rx="5" fill="#6b6f8a"/>
  <rect x="692" y="324" width="96" height="16" rx="5" fill="#6b6f8a"/>
  <rect x="610" y="458" width="140" height="40" rx="9" fill="#e6e8ef"/>
  <rect x="770" y="458" width="150" height="40" rx="9" fill="#c9ccd8"/>
</svg>
